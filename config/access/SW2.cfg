enable
configure terminal
hostname SW2
line console 0
logging synchronous
exec-timeout 0 0
exit
no ip domain lookup

vtp mode client
vtp version 2
vtp domain CIN4ENSPY
vtp password Lab12345


interface e0/2
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk native vlan 200
switchport trunk allowed vlan 225,235,245,255
no shutdown
exit

interface range e0/0-1
descr SW2_INTERCO_AG2
channel-protocol lacp
channel-group 21 mode active
no shutdown
exit
interface Port-channel21
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk native vlan 200
switchport trunk allowed vlan 245,255
no shutdown
exit

int e0/3
switchport mode access
switchport access vlan 245
switchport nonegotiate
spanning-tree portfast
spanning-tree bpduguard enable
no shutdown
switchport port-security
switchport port-security maximum 2
switchport port-security mac-address sticky
switchport port-security violation shutdown
exit

int e1/0
switchport mode access
switchport access vlan 255
switchport nonegotiate
spanning-tree portfast
spanning-tree bpduguard enable
no shutdown
switchport port-security
switchport port-security maximum 2
switchport port-security mac-address sticky
switchport port-security violation shutdown
exit


spanning-tree mode mst

spanning-tree mst configuration
 name CIN4_MST_LAB
 revision 1
 instance 1 vlan 211, 212, 225, 235
 instance 2 vlan 245, 255
 exit



snmp-server community CIN4_HN_MST
access-list 10 permit 192.168.201.14
snmp-server community CIN4_HN_MST RO 10

snmp-server location ACCESS
snmp-server contact julesdaroldb@gmail.com 

snmp-server enable traps

snmp-server host 192.168.201.14 version 2c CIN4_HN_MST


no ip routing 

do wr


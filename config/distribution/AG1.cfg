enable
configure terminal
hostname AG1
line console 0
logging synchronous
exec-timeout 0 0
exit
no ip domain lookup


vtp mode server
vtp version 2
vtp domain CIN4ENSPY
vtp password Lab12345

vlan 200
name NATIF
vlan 212
name PARC
vlan 211
name MGMT

vlan 225
name HN
vlan 235
name AN
vlan 245
name CIN
vlan 255
name ICD
exit


interface loopback0
ip address 2.2.2.4 255.255.255.255
no shutdown
exit

interface e0/0
no switchport
ip address 192.168.10.17 255.255.255.252
no shutdown
exit

interface e0/1
no switchport
ip address 192.168.10.25 255.255.255.252
no shutdown
exit

interface range e0/2-3
description Dis1_INTERCO_Dis2
no switchport
channel-group 20 mode active
exit

interface Port-channel20
ip address 192.168.10.9 255.255.255.252
no shutdown
exit

interface range e1/0-1
descr DIS1_INTERCO_SW1
channel-protocol lacp
channel-group 19 mode active
no shutdown
exit

interface Port-channel19
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk native vlan 200
switchport trunk allowed vlan 225,235
no shutdown
exit

interface e1/2
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk native vlan 200
switchport trunk allowed vlan 225,235,245,255
no shutdown
exit


interface vlan 225
ip address 192.168.225.1 255.255.255.0
standby 225 ip 192.168.225.254
standby 225 priority 150 
standby 225 preempt 
no shutdown
exit

interface vlan 235
ip address 192.168.235.1 255.255.255.0
standby 235 ip 192.168.235.254
standby 235 priority 150 
standby 235 preempt 
no shutdown
exit

interface vlan 245
ip address 192.168.245.1 255.255.255.0
standby 245 ip 192.168.245.254
no shutdown
exit

interface vlan 255
ip address 192.168.255.1 255.255.255.0
standby 255 ip 192.168.255.254
no shutdown
exit


interface vlan 225
ip helper-address 2.2.2.2
ip helper-address 2.2.2.3
exit
interface vlan 235
ip helper-address 2.2.2.2
ip helper-address 2.2.2.3
exit
interface vlan 245
ip helper-address 2.2.2.2
ip helper-address 2.2.2.3
exit
interface vlan 255
ip helper-address 2.2.2.2
ip helper-address 2.2.2.3
exit


ip routing
router ospf 1
network 2.2.2.4 0.0.0.0 area 0
network 192.168.10.16 0.0.0.3 area 0
network 192.168.10.8 0.0.0.3 area 0
network 192.168.10.24 0.0.0.3 area 0
network 192.168.225.0 0.0.0.255 area 0
network 192.168.235.0 0.0.0.255 area 0
network 192.168.245.0 0.0.0.255 area 0
network 192.168.255.0 0.0.0.255 area 0
exit


spanning-tree mode mst

spanning-tree mst configuration
name CIN4_MST_LAB
revision 1
instance 1 vlan 211, 212, 225, 235
instance 2 vlan 245, 255
exit

spanning-tree mst 1 priority 4096
spanning-tree mst 2 priority 8192


snmp-server community CIN4_HN_MST
access-list 10 permit 192.168.201.14
snmp-server community CIN4_HN_MST RO 10

snmp-server location DISTRIBUTION
snmp-server contact julesdaroldb@gmail.com 

snmp-server enable traps

snmp-server host 192.168.201.14 version 2c CIN4_HN_MST

do copy run start

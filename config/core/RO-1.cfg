enable
configure terminal
hostname RO-1
line console 0
logging synchronous
exec-timeout 0 0
exit
no ip domain lookup


int lo1
ip address 2.2.2.2 255.255.255.255
description RO-1_LOOPBACK
no shutdown
exit

int e0/0
ip address 24.40.2.1 255.255.255.252
description RO-1_INTERCO_FAI
no shutdown 
exit 

int e0/1
ip address 192.168.10.18 255.255.255.252
description RO-1_INTERCO_AG1
no shutdown 
exit 

int e0/2
ip address 192.168.10.22 255.255.255.252
description RO-1_INTERCO_AG2
no shutdown 
exit 



ip dhcp excluded-address 192.168.225.1 192.168.225.10
ip dhcp excluded-address 192.168.225.250 192.168.225.254

ip dhcp excluded-address 192.168.235.1 192.168.235.10
ip dhcp excluded-address 192.168.235.250 192.168.235.254

ip dhcp excluded-address 192.168.245.1 192.168.245.10
ip dhcp excluded-address 192.168.245.250 192.168.245.254

ip dhcp excluded-address 192.168.255.1 192.168.255.10
ip dhcp excluded-address 192.168.255.250 192.168.255.254

ip dhcp pool HN
network 192.168.225.0 255.255.255.0
default-router 192.168.225.254
dns-server 8.8.8.8 8.8.4.4
exit

ip dhcp pool AN
network 192.168.235.0 255.255.255.0
default-router 192.168.235.254
dns-server 8.8.8.8 8.8.4.4
exit

ip dhcp pool CIN
network 192.168.245.0 255.255.255.0
default-router 192.168.245.254
dns-server 8.8.8.8 8.8.4.4
exit

ip dhcp pool ICD
network 192.168.255.0 255.255.255.0
default-router 192.168.255.254
dns-server 8.8.8.8 8.8.4.4
exit


router ospf 1
network 2.2.2.2 0.0.0.0 area 0
network 24.40.2.0 0.0.0.3 area 0
network 192.168.10.16 0.0.0.3 area 0
network 192.168.10.20 0.0.0.3 area 0
exit


snmp-server community CIN4_HN_MST
access-list 10 permit 192.168.201.14
snmp-server community CIN4_HN_MST RO 10

snmp-server location CORE
snmp-server contact julesdaroldb@gmail.com 

snmp-server enable traps

snmp-server host 192.168.201.14 version 2c CIN4_HN_MST

do copy run start

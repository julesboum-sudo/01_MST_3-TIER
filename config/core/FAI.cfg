enable
configure terminal
hostname FAI
line console 0
logging synchronous
exec-timeout 0 0
exit
no ip domain lookup

int lo1
ip address 2.2.2.1 255.255.255.255
no shutdown
exit

int e0/0
ip address dhcp
description FAI_INTERCO_INTERNET
no shutdown 
exit 

int e0/1
ip address 24.40.2.2 255.255.255.252
description FAI_INTERCO_RO-1
no shutdown 
exit 

int e0/2
ip address 25.40.2.2 255.255.255.252
no shutdown 
description FAI_INTERCO_RO2
exit 

router ospf 1
network 2.2.2.1 0.0.0.0 area 0
network 24.40.2.0 0.0.0.3 area 0
network 25.40.2.0 0.0.0.3 area 0
default-information originate
exit

interface e0/0
ip nat outside
exit
interface e0/1
ip nat inside
exit
interface e0/2
ip nat inside
exit

access-list 1 permit 192.168.225.0 0.0.0.255
access-list 1 permit 192.168.235.0 0.0.0.255
access-list 1 permit 192.168.245.0 0.0.0.255
access-list 1 permit 192.168.255.0 0.0.0.255
access-list 1 permit 192.168.201.0 0.0.0.15

ip nat inside source list 1 interface e0/0 overload

snmp-server community CIN4_HN_MST
access-list 10 permit 192.168.201.14
snmp-server community CIN4_HN_MST RO 10

snmp-server location CORE
snmp-server contact julesdaroldb@gmail.com 

snmp-server enable traps

snmp-server host 192.168.201.14 version 2c CIN4_HN_MST

do copy run start
